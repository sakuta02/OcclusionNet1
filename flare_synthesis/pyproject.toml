[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "flare-synthesis"
version = "0.1.0"
description = "Synthetic lens-flare frame generation for the DaytimeFlare / NighttimeFlare classes."
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "Pillow>=9.5",
  "torch>=2.1",
  "torchvision>=0.16",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
