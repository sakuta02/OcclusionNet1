[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "occlusion-classifier"
version = "0.1.0"
description = "Multilabel occlusion classifier on a frozen segmentation encoder with per-class attention queries."
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "Pillow>=9.5",
  "torch>=2.1",
  "torchvision>=0.16",
  "segmentation-models-pytorch>=0.3",
  "scikit-learn>=1.3",
  "matplotlib>=3.7",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
tracking = ["clearml>=1.13"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
