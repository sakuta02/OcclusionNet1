[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "occlusion-score"
version = "0.1.0"
description = "Offline training and lightweight production scoring for image occlusion."
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "Pillow>=9.5",
  "torch>=2.1",
  "torchvision>=0.16",
  "opencv-python-headless>=4.8",
  "joblib>=1.3",
  "pandas>=2.0",
  "scikit-learn>=1.3",
  "scipy>=1.11",
  "pyyaml>=6.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
